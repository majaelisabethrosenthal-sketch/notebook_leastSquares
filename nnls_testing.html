  <script id="5" type="text/markdown">
    ## Testing least squares (dgels vs. quaprog)

    Let us first test dgels: 
  </script>
  <script id="6" type="module" pinned="">
    import normal from 'https://cdn.jsdelivr.net/gh/stdlib-js/random-base-normal@esm/index.mjs';
    import uniform from 'https://cdn.jsdelivr.net/gh/stdlib-js/random-base-uniform@esm/index.mjs';
    import { dgels } from "./pca_projection.browser.js";
    const M = 10;
    const N = 2; 
    const A = new Float64Array(M * N); 
    for (let i = 0; i < M; i++) {
      A[i * N + 0] = uniform(0,5);
      A[i * N + 1] = uniform(0,5);
    }
    const A_copy = new Float64Array(A);
    display(A_copy);

    const b = new Float64Array(M);
    for (let i = 0; i < M; i++) {
        b[i] = A[i * N + 0] * 2 + A[i * N + 1] * 4 + normal(0, 2);
    }
    const b_copy = new Float64Array(b);
    display(b_copy);

    dgels('row-major', 'no-transpose', M, N, 1, A, N, b, 1 );
    const coordinates = b.slice(0, N);
    display(coordinates);
  </script>
  <script id="7" type="text/markdown">
    And now quadprog 
    
    Note: somehow quadprog wants a non-empty Amat matrix and bvec vector.
  </script>
  <script id="8" type="module" pinned="">
    const AtA = [];
    for (let i = 1; i <= N; i++) {
      AtA[i] = [];
      for (let j = 1; j <= N; j++) {
        let sum = 0;
        for (let k = 0; k < M; k++) {
          sum += A_copy[k*N+(i-1)] * A_copy[k*N+(j-1)];
        }
        AtA[i][j] = sum;
      }
    }
    display(AtA);

    const Atb = [];
    for (let i = 1; i <= N; i++) {
      let sum = 0;
      for (let k = 0; k < M; k++) {
        sum += A_copy[k*N+(i-1)] * b_copy[k];
      }
      Atb[i] = sum;
    }
    display(Atb);

    const Amat_dummy = [];
    Amat_dummy[1] = []; Amat_dummy[2] = [];
    Amat_dummy[1][1] = 1;   
    Amat_dummy[2][1] = 0;   

    const bvec_dummy = [];
    bvec_dummy[1] = -1e10; 

    const meq = 0;
    const result_unconstrained = solveQP(AtA, Atb, Amat_dummy, bvec_dummy, meq);
    display(result_unconstrained.solution);
  </script>
