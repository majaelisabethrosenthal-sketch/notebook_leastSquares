  <title>PCA Projection NNLS</title>
  <script id="1" type="text/markdown">
    # Non-negative least squares with sum-to-one constraint applied to PCA projection
  </script>
  <script id="2" type="text/markdown">
    We here test out non-negative least squares, applied to the individuals we projected onto the PCA space, to see a target individual's PC coordinates to be expressed as a non-negative, sum-to-one mixture of reference populations.
    For example "70% Spain + 30% Germany", or "50% Italy + 30% Germany + 20% England". 
    
    This mirrors an admixture-style decomposition.
    
    We look for proportions ${tex`\alpha, \beta, (\gamma) \ge 0`} with ${tex`\alpha + \beta (+ \gamma) = 1`} such that
  
    ${tex`\alpha \cdot \vec{\mu}_{\text{pop1}} + \beta \cdot \vec{\mu}_{\text{pop2}} (+ \gamma \cdot \vec{\mu}_{\text{pop3}}) = \vec{x}_{\text{target}}`}
    
    ## Preparing PCA projection
    To see how this is done, click [here](./pca_projection.html)
  </script>
  <script id="3" type="module">
    const weightDat = FileAttachment("data/Joscha_HiRes_WestEurasia_weights_with_freqs.txt")
      .text().then(t => readSnpWeights(t));
  </script>
  <script id="4" type="text/x-typescript">
    const gretzingerPlinkData = await (async () => {
      const bimDat = await FileAttachment("data/2024_Gretzinger_EarlyCelts.bim").text().then(t => readBimData(t));
      const famDat = await FileAttachment("data/2024_Gretzinger_EarlyCelts.fam").text().then(t => readFamData(t));
      const bedDat = await FileAttachment("data/2024_Gretzinger_EarlyCelts.bed")
        .arrayBuffer()
        .then(a => readBedData(a, bimDat.snpIDs.length, famDat.indNames.length));
      return { bimDat, famDat, bedDat, numSnps: bimDat.snpIDs.length, numInds: famDat.indNames.length };
    })()

    const plinkDat = gretzingerPlinkData;
  </script>
  <script id="5" type="text/x-typescript">
    const overlap = getOverlapMasks(plinkDat.bimDat, weightDat);
  </script>
  <script id="6" type="text/x-typescript">
    const {pcWeights : reducedPcWeights, frequencies : reducedFrequencies} = reducePcWeights(weightDat, overlap)
  </script>
  <script id="7" type="text/x-typescript">
    const genoMatrix = extractAndTransposeGenotypes(plinkDat.bedDat, plinkDat.numSnps, plinkDat.numInds, overlap)
  </script>
  <script id="8" type="text/markdown">
    ## Testing the PCA projection
  </script>
  <script id="9" type="text/x-typescript">
    const params = await FileAttachment("data/Joscha_HiRes_WestEurasia_parameters.json").json()
  </script>
  <script id="10" type="text/x-typescript">
    const projectionResults = projectSamples(genoMatrix, reducedPcWeights, reducedFrequencies, plinkDat.numInds, weightDat.numPCs, params.nSNPs, params.yScale, params.eigenValues)
  </script>

  </script>

        pc9: o.pcCoordinates[8],

      }))
  </script>
  <script id="16" type="text/x-typescript" pinned="">

  <script id="60" type="text/markdown">
    ## Testing NNLS

    We now calculate and visualize the non-negative, sum-to-one mixture of reference populations. 

    ### Testing two reference groups
    As an initial test, we perform a decomposition using Germany and Spain as reference groups. 
    Let us first plot these two groups and their mean. 
  </script>
  <script id="61" type="text/x-typescript" pinned="">
    import { solveQP } from "quadprog";

    const numPCsUsed2 = 2;
    const populationNames2 = ["Germany", "Spain"];

    const centroids2 = populationNames2.map(pop => getPopulationMean(refDat, pop, numPCsUsed2));
  </script>
  <script id="62" type="text/x-typescript" pinned="">
    Plot.plot({
      color: {legend: true, domain: ["Germany", "Spain"]},
      marks: [
        Plot.dot(refDat, {x: d => -d.pc2, y: "pc1", filter: d => d.pop === "Germany", fill: "pop", opacity: 0.3}),        
        Plot.dot([{x: -centroids2[0][1], y: centroids2[0][0]}], {x: "x", y: "y", fill: "red"}),
        Plot.dot(refDat, {x: d => -d.pc2, y: "pc1", filter: d => d.pop === "Spain",  fill: "pop", opacity: 0.3}),
        Plot.dot([{x: -centroids2[1][1], y: centroids2[1][0]}], {x: "x", y: "y", fill: "red"}),
        Plot.dot(individuals, {x: d => -d.pc2, y: "pc1", tip: true, title: d => d.individual}),
      ]
    })
  </script>
  <script id="63" type="text/markdown">
    We can now calculate ${tex`\alpha`} and ${tex`\beta`} and visualize them in a stacked barchart.
  </script>
  <script id="64" type="text/x-typescript" pinned="">
    const AtA2 = computeAtA(centroids2, numPCsUsed2);
    const constraints2 = buildConstraints(populationNames2.length);
    const NNLSResults2 = validIndividuals
      .map((o, idx) => {
        const target2 = o.pcCoordinates.slice(0, numPCsUsed2);
        const [alpha, beta] = computeNNLS(centroids2, target2, numPCsUsed2, constraints2, AtA2);
        return { individual: idx, Germany: alpha, Spain: beta };
      });

    display(Inputs.table(NNLSResults2));

    const tidy2 = NNLSResults2.flatMap(d => [
      { individual: d.individual, population: "Germany", proportion: d.Germany },
      { individual: d.individual, population: "Spain", proportion: d.Spain },
    ]);

  </script>
  <script id="65" type="module" pinned="">
    Plot.plot({
      color: { legend: true },
      marks: [
        Plot.barY(tidy2, {
          x: "individual",
          y: "proportion",
          fill: "population",
        })
      ]
    })
  </script>

  <script id="71" type="text/markdown">
    ### Testing the impact of the number of PCs  
    Let us now perform the same decomposition using Germany, Italy and England as reference groups, while increasing the number of PCs. 

  </script>

  <script id="72" type="module">
    const targetIndividualIdx2 = view(Inputs.range([0, validIndividuals.length - 1], {
      label: "Individual",
      step: 1,
      value: 0
    }));
  </script>

  <script id="75" type="module">
    const target = validIndividuals[targetIndividualIdx2];  
    const pcRange = [3, 4, 5, 6, 7, 8, 9, 10];
    const populationNames = ["Germany", "Italy", "England"];    
    const comparisonResults = pcRange.map(numPCs => {
      const centroids = populationNames.map(pop => getPopulationMean(refDat, pop, numPCs));
      const AtA = computeAtA(centroids, numPCs);
      const constraints = buildConstraints(populationNames.length);
      const targetCoords = target.pcCoordinates.slice(0, numPCs);
      const [alpha, beta, gamma] = computeNNLS(centroids, targetCoords, numPCs, constraints, AtA);
      return { numPCs, Germany: alpha, Italy: beta, England: gamma };
    });
    display(comparisonResults);

    const tidy = comparisonResults.flatMap(d => [
      { numPCs: d.numPCs, population: "Germany", proportion: d.Germany },
      { numPCs: d.numPCs, population: "Italy", proportion: d.Italy },
      { numPCs: d.numPCs, population: "England", proportion: d.England },
    ]);
  </script>
  <script id="76" type="module" pinned="">
    Plot.plot({
      color: { legend: true, domain: ["Germany", "Italy", "England"] },
      x: { label: "Number of PCs used" },
      y: { domain: [0, 1], label: "Estimation of components" },
      marks: [
        Plot.line(tidy, { x: "numPCs", y: "proportion", stroke: "population" }),
        Plot.dot(tidy, { x: "numPCs", y: "proportion", fill: "population" })
      ]
    })
  </script>
  <script id="77" type="text/markdown">
    We can see that the estimates are initially unstable with fewer PCs, but stabilize consistently starting at six or seven PCs.
    
    So let us compare the same decomposition shown in stacked bar charts using three, six and ten PCs. 
  </script>

  <script id="78" type="text/x-typescript">
    const PCs = [3, 6, 10];
    const results6_10 = PCs.map(numPCs => {
      const centroids = populationNames.map(pop => getPopulationMean(refDat, pop, numPCs));
      const AtA = computeAtA(centroids, numPCs);
      const constraints = buildConstraints(populationNames.length);
      
      const NNLSResults = validIndividuals.map((o, idx) => {
        const target = o.pcCoordinates.slice(0, numPCs);
        const [alpha, beta, gamma] = computeNNLS(centroids, target, numPCs, constraints, AtA);
        return { individual: idx, numPCs, Germany: alpha, Italy: beta, England: gamma };
      });
      
      return NNLSResults;
    });

    const flatResults = results6_10.flat();

    const tidy6_10 = flatResults.flatMap(d => [
      { individual: d.individual, numPCs: d.numPCs, population: "Germany", proportion: d.Germany },
      { individual: d.individual, numPCs: d.numPCs, population: "Italy", proportion: d.Italy },
      { individual: d.individual, numPCs: d.numPCs, population: "England", proportion: d.England },
    ]);

  </script>
  <script id="79" type="text/x-typescript" pinned="">
    Plot.plot({
      width: 1000,
      color: { legend: true, domain: ["Germany", "Italy", "England"]},      
      marks: [
        Plot.barY(tidy6_10, {
          x: "numPCs",
          y: "proportion",
          fill: "population",
          fx: "individual",
        }),
      ]
    })
  </script>
