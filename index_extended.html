  <title>Least Squares</title>
  <script id="1" type="text/markdown">
    # Least Squares

    The least-squares problem is a fundamental problem in numerical linear algebra and statistics. Given a matrix `A` and a vector `b`, the least-squares problem is to find a vector `x` that minimizes the Euclidean norm of the residual `R = b - A*x`. The solution to this problem can be computed using the `dgels` function, which is part of the LAPACK library.

    The `dgels` function computes the least-squares solution to a linear system of equations. It can handle both overdetermined systems (where there are more equations than unknowns) and underdetermined systems (where there are more unknowns than equations). The function uses QR factorization to compute the solution efficiently.

    In this notebook, we will demonstrate how to use the `dgels` function to solve a least-squares problem in JavaScript. We will simulate some data, fit a linear model to the data using least squares, and visualize the results.
  </script>
  <script id="2" type="text/markdown">
    Let us first simulate some data under a simple linear model:
  </script>
  <script id="3" type="module" pinned="">
    import normal from 'https://cdn.jsdelivr.net/gh/stdlib-js/random-base-normal@esm/index.mjs';
    import linspace from 'https://cdn.jsdelivr.net/gh/stdlib-js/array-base-linspace@esm/index.mjs';
    const x = linspace( 0, 4, 20 );
    const data = x.map( xi => ({
      x: xi,
      y: 2*xi + normal( 0, 2 )
    }));
    display(data);
    display(data.length)
  </script>
  <script id="4" type="text/markdown">
    and plot the data:
  </script>
  <script id="5" type="module" pinned="">
    Plot.plot({
      marks: [
        Plot.dot(data, { x: "x", y: "y", fill: "steelblue" }),
        Plot.line([[0, 0], [4, 8]], { stroke: "red" }),
        Plot.line([[0, 0], [4, 4 * fittedSlope]], { stroke: "blue" })
      ]
    })
  </script>
  <script id="6" type="module" pinned="">
    import { dgels , dtrtri, extractMatrix, transposeMatrix, MatrixMultiplication, extractStandardErrors, computeEllipseValues, generateEllipse} from "./pca_projection.browser.js";
    const A = new Float64Array( data.length );
    const b = new Float64Array( data.length );
    for ( let i = 0; i < data.length; i++ ) {
      A[ i ] = data[i].x;
      b[ i ] = data[i].y;
    }
    dgels( 'row-major', 'no-transpose', data.length, 1, 1, A, 1, b, 1 );
    display(A);
    display(b);
    const fittedSlope = b[0];
    const rss = b.slice(1).reduce( (acc, val) => acc + val*val, 0 );
    const rawSSX = x.reduce((acc, val) => acc + (val * val), 0);
    const standardError = Math.sqrt((rss / (data.length - 1)) / rawSSX);
  </script>

  <script id="7" type="text/markdown">
    The fitted slope is ${fittedSlope}, and the residual sum of squares (RSS) is ${rss}. The standard error of the slope can be computed as ${tex`SE(\beta_1) = \sqrt{\frac{\frac{\text{RSS}}{n - 1}}{\sum_{i=1}^{n} (x_i^2)}}`}, where _n_ is the number of data points. In this case, the standard error is ${standardError}.
  </script>
  <script id="8" type="text/markdown">    
    We can also calculate the standard error using the variance-covariance matrix of the least squares parameters, given by ${tex`\text{Var}(\hat{\beta}) = (X^T X)^{-1} \sigma^2`} (where ${tex`X`} is our input matrix ${tex`A`}).

    Instead of computing ${tex`(X^T X)^{-1}`} directly, we use the ${tex`R`} matrix from the QR decomposition (stored in the overwritten array ${tex`A`}) for better numerical stability and precision. 

    Assuming the QR decomposition ${tex`X = Q R`}, where ${tex`Q`} is an orthogonal matrix and ${tex`R`} is an upper triangular matrix:
    ${tex`\begin{aligned}
    (X^T X)^{-1} &= (R^T Q^T Q R)^{-1} \\
    &= (R^T R)^{-1} \quad (\text{since } Q^T Q = I)
    \end{aligned}`}

    Thus, we only need the upper triangular matrix ${tex`R`}, which is stored on and above the diagonal of the array ${tex`A`}. Note: dgels or more precisely dgeqrf stores the overwritten Matrix A dependending on what you have given for order ('row-major' or 'column-major'). (see dgels_test.html)
  </script>
  <script id="9" type="module" pinned="">
    const R_matrix = extractMatrix(A, 1);
    display(R_matrix);
  </script>
  <script id="10" type="text/markdown">    
    We now transpose our Matrix R.
  </script>
  <script id="11" type="module" pinned="">
    const R_T= transposeMatrix(R_matrix,1);
    display(R_T);
  </script>
  <script id="12" type="text/markdown">    
    Now we calculate ${tex`(R)^{-1}`}. For this we will need another function `dtrtri` from the LAPACK library. For now we can do an easy calculation because it is a 1x1 Matrix
  </script>
  <script id="13" type="module" pinned="">
    dtrtri('row-major', 'upper', 'non-unit', 1, R_matrix, 1);
    dtrtri('row-major', 'upper', 'non-unit', 1, R_T, 1);
    //const R_inv = 1 / R_matrix[0];
    //const R_T_inv = 1 / R_T[0];
    const XtX_inv = R_matrix[0] * R_T[0]; 
    const sigma_2 = rss / (data.length - 1);
    const standard_error = Math.sqrt(XtX_inv * sigma_2);
    display(standard_error);
  </script>
  <script id="14" type="text/markdown">
    ### Testing the impact of an outlier on the RSS
  </script>

  <script id="15" type="text/markdown">
    We first manipulate a data point from the given data above that does not follow the linear model.
  </script>

  <script id="16" type="module" pinned="">
    const outlierData = data.map((d, index) => {
      if (index === 10) {
        return { x: d.x, y: 20.0, isOutlier: true }; 
      }
      return { ...d, isOutlier: false };
    });
  </script>
>
  <script id="17" type="text/markdown">
    and plot the manipulated data:
  </script>

  <script id="18" type="module" pinned="">
    Plot.plot({
      marks: [
        Plot.dot(outlierData, { 
          x: "x", 
          y: "y", 
          fill: d => d.isOutlier ? "red" : "steelblue",
          r: d => d.isOutlier * 3 + 3, 
        }),
        Plot.line([[0, 0], [4, 8]], { stroke: "red" }),
        Plot.line([[0, 0], [4, 4 * fittedSlopeOutlier]], { stroke: "blue" })
      ]
    })
  </script>

  <script id="19" type="module" pinned="">
    const A_out = new Float64Array( outlierData.length );
    const b_out = new Float64Array( outlierData.length );
    for ( let i = 0; i < outlierData.length; i++ ) {
      A_out[ i ] = outlierData[i].x;
      b_out[ i ] = outlierData[i].y;
    }
    dgels( 'row-major', 'no-transpose', outlierData.length, 1, 1, A_out, 1, b_out, 1 );
    const fittedSlopeOutlier = b_out[0];
    const rssOutlier = b_out.slice(1).reduce( (acc, val) => acc + val*val, 0 );
  </script>

  <script id="20" type="text/markdown">
    The fitted slope is now **${fittedSlopeOutlier}**, and the new RSS rises up to **${rssOutlier}** (compared to ${rss} originally). 
  </script>

  <script id="21" type="text/markdown">
    ## Testing multiple dimensions
  </script>
  <script id="22" type="module" pinned="">
    import uniform from 'https://cdn.jsdelivr.net/gh/stdlib-js/random-base-uniform@esm/index.mjs';
    const mdata = Array.from({length:20}, () => {
      const x1 = uniform(0, 10);
      const x2 = uniform(0, 10);
      const x3 = uniform(0, 10);
      const x4 = uniform(0, 10);
      return {
        x1, x2, x3, x4,
        y: 1 * x1 + (-2) * x2 + 3 * x3 + (-4) * x4 + normal(0, 2)
      }
    })
    display(mdata.length)
  </script>
  <script id="23" type="module" pinned="">
    Inputs.table(mdata)
  </script>
  <script id="24" type="module" pinned="">
    const A_m = new Float64Array( mdata.length * 4);
    const b_m = new Float64Array( mdata.length );
    for ( let i = 0; i < mdata.length; i++ ) {
      A_m[ i * 4 + 0 ] = mdata[i].x1;
      A_m[ i * 4 + 1 ] = mdata[i].x2;
      A_m[ i * 4 + 2 ] = mdata[i].x3;
      A_m[ i * 4 + 3 ] = mdata[i].x4;
      b_m[ i ] = mdata[i].y;
    }
    dgels( 'row-major', 'no-transpose', mdata.length, 4, 1, A_m, 4, b_m, 1 );
    display(A_m)
    const fittedCoefficients = b_m.slice(0, 4);
    display(fittedCoefficients)
    const rssMulti  = b_m.slice(4).reduce( (acc, val) => acc + val*val, 0 );
  </script>
  <script id="25" type="text/markdown">
    The RSS is ${rssMulti}. 
  </script> 
  <script id="26" type="text/markdown">
    We now also want to calculate the standard error for a multi-dimensional dataset.
  </script>
  <script id="27" type="module" pinned="">
    const R_matrix_multi = extractMatrix(A_m, 4);

    const R_T_multi= transposeMatrix(R_matrix_multi, 4);

    dtrtri('row-major', 'upper', 'non-unit', 4, R_matrix_multi, 4);
    dtrtri('row-major', 'lower', 'non-unit', 4, R_T_multi, 4);

    const XtX_inv_multi = MatrixMultiplication(R_matrix_multi, R_T_multi, 4);

    const sigma_2_multi = rssMulti / (mdata.length - 4);
    const var_covar_matrix = new Float64Array(4*4);
    for (let i = 0; i < XtX_inv_multi.length; i++) {
        var_covar_matrix[i] = XtX_inv_multi[i] * sigma_2_multi;
    }
    const SE_diagonals = extractStandardErrors(var_covar_matrix, 4);
    display(var_covar_matrix);
    display(SE_diagonals);
  </script>

  <script id="28" type="text/markdown">

  </script>

  <script id="29" type="module" pinned="">

      if (index === 3) {
        return { ...d, y: 100.0 }; 
      }

  </script> 

  <script id="30" type="text/x-typescript" pinned="">

  <script id="31" type="text/x-typescript" pinned="">
    const A_m_out = new Float64Array( outlierMData.length * 4 );

      A_m_out[ i * 4 + 1 ] = outlierMData[i].x2;

    display(fittedCoefficientsOutlier)

  <script id="32" type="text/markdown">
    With the multi-dimensional outlier included, the RSS now is  **${rssMultiOutlier}** (compared to ${rssMulti} originally). 
  </script> 

  <script id="33" type="text/markdown">
    # Estimating coordinates
  </script>
 
  <script id="34" type="text/markdown">
    Instead of estimating a slope, we now estimate the coordinates of an unknown point from several noisy linear measurements of it. 
    This mirrows exactly what will happen in the PCA projection. 
  </script>   
  <script id="35" type="module" pinned="">
    const M = 10;
    const N = 2; 
    const A_weights = new Float64Array(M * N); 
    for (let i = 0; i < M; i++) {
      A_weights[i * N + 0] = uniform(0,5);
      A_weights[i * N + 1] = uniform(0,5);
    }

    const b_measure = new Float64Array(M);
    for (let i = 0; i < M; i++) {
        b_measure[i] = A_weights[i * N + 0] * 2 + A_weights[i * N + 1] * 4 + normal(0, 2);
    }

    dgels( 'row-major', 'no-transpose', M, N, 1, A_weights, N, b_measure, 1 );
    const coordinates = b_measure.slice(0, N);
    display(coordinates);
    const rss_c = b_measure.slice(N).reduce((acc, val) => acc + val*val, 0);
    display(rss_c); 

    const R = extractMatrix(A_weights, N);
    const RT = transposeMatrix(R, N);

    dtrtri('row-major', 'upper', 'non-unit', N, R, N);
    dtrtri('row-major', 'lower', 'non-unit', N, RT, N);

    const RtR_inv = MatrixMultiplication(R, RT, N); 
    const sigma_2 = rss_c / (M - N);
    const var_covar_matrix_c = new Float64Array(N * N);
    for (let i = 0; i < RtR_inv.length; i++) {
        var_covar_matrix_c[i] = RtR_inv[i] * sigma_2;
    }
    display(var_covar_matrix_c);
    const SE = extractStandardErrors(var_covar_matrix_c, N);
    display([SE]);
  </script> 
  <script id="36" type="text/markdown">
    Let us now plot this. Green is the true point and red is the estimated point.
  </script>
  <script id="37" type="module" pinned="">
    Plot.plot({
        x: { domain: [0, 6] },
        y: { domain: [0, 6] },
        marks: [
            Plot.dot([{x: 2, y: 4}], {x: "x", y: "y", fill: "green"}),
            Plot.dot([{x: coordinates[0], y: coordinates[1]}], {x: "x", y: "y", fill: "red"}),
            Plot.ruleY([{x1: coordinates[0] - SE[0], x2: coordinates[0] + SE[0], y: coordinates[1]}], {x1:"x1", x2: "x2", y: "y", stroke: "black", strokeOpacity: 0.5}),
            Plot.ruleX([{x: coordinates[0], y1: coordinates[1] - SE[1], y2: coordinates[1] + SE[1]}], {y1:"y1", y2: "y2", x: "x",stroke: "black", strokeOpacity: 0.5})
        ]
    })    
  </script>
  <script id="38" type="text/markdown">
    Up to this point, we have only looked at the diagonal elements of our variance-covariance matrix, effectively treating our coordinates as independent variables. However, the off-diagonal elements store non-zero covariances that capture how the principal components relate to one another.
    To account for this correlation and accurately visualize our uncertainty, we now want to plot a covariance error ellipse. To do this, we first have to compute the eigenvalues and the rotation angle of the covariance matrix to properly align the ellipse with our data orientation.
    Then we scale the resulting semi-axes using a Chi-squared threshold corresponding to our desired confidence level (e.g., 95%). Finally we transform these mathematical parameters into screen coordinates.
  </script>
  <script id="39" type="module" pinned="">
    const a = var_covar_matrix_c[0];
    const b = var_covar_matrix_c[1];
    const c = var_covar_matrix_c[2];
    const d = var_covar_matrix_c[3];

    const s_95 = -2 * Math.log(1-0.95);
    display(s_95);
    const s_90 = -2 * Math.log(1-0.9);
    display(s_90);
    const s_99 = -2 * Math.log(1-0.99);
    display(s_99);

    const nPoints = 100;


    // 1
    const diff = a - d;
    const tmp = Math.sqrt(diff * diff + 4 * b * b);
    const lambda1 = (a + d + tmp) / 2;
    const lambda2 = (a + d - tmp) / 2;

    const theta = 0.5 * Math.atan2(2 * b, diff);
    const semiMajor = Math.sqrt(lambda1);
    const semiMinor = Math.sqrt(lambda2);

    const semiMajor95 = Math.sqrt(lambda1 * s_95);
    const semiMinor95 = Math.sqrt(lambda2 * s_95);

    const semiMajor90 = Math.sqrt(lambda1 * s_90);
    const semiMinor90 = Math.sqrt(lambda2 * s_90);
    
    const semiMajor99 = Math.sqrt(lambda1 * s_99);
    const semiMinor99 = Math.sqrt(lambda2 * s_99);

    // 2
    const trace = a + d;
    const det = a*d - b*c;
    const term = Math.sqrt((trace*trace)/4 - det);
    const eigen1 = trace/2 + term; // größerer Eigenwert
    const eigen2 = trace/2 - term; // kleinerer Eigenwert

    const angle = Math.atan2(eigen1 - a, b); // Richtung des ersten Eigenvektors
    const SemiMajor = Math.sqrt(eigen1);
    const SemiMinor = Math.sqrt(eigen2);

    // 1
    const points = [];
    for (let i = 0; i <= nPoints; i++) {
        const t = (i / nPoints) * 2 * Math.PI;
        const ex = semiMajor * Math.cos(t);
        const ey = semiMinor * Math.sin(t);
        const x = coordinates[0] + ex * Math.cos(theta) - ey * Math.sin(theta);
        const y = coordinates[1] + ex * Math.sin(theta) + ey * Math.cos(theta);
        points.push({ x, y });
    }

    const points95 = [];
    for (let i = 0; i <= nPoints; i++) {
        const t = (i / nPoints) * 2 * Math.PI;
        const ex = semiMajor95 * Math.cos(t);
        const ey = semiMinor95 * Math.sin(t);
        const x = coordinates[0] + ex * Math.cos(theta) - ey * Math.sin(theta);
        const y = coordinates[1] + ex * Math.sin(theta) + ey * Math.cos(theta);
        points95.push({ x, y });
    }

    const points90 = [];
    for (let i = 0; i <= nPoints; i++) {
        const t = (i / nPoints) * 2 * Math.PI;
        const ex = semiMajor90 * Math.cos(t);
        const ey = semiMinor90 * Math.sin(t);
        const x = coordinates[0] + ex * Math.cos(theta) - ey * Math.sin(theta);
        const y = coordinates[1] + ex * Math.sin(theta) + ey * Math.cos(theta);
        points90.push({ x, y });
    }

    const points99 = [];
    for (let i = 0; i <= nPoints; i++) {
        const t = (i / nPoints) * 2 * Math.PI;
        const ex = semiMajor99 * Math.cos(t);
        const ey = semiMinor99 * Math.sin(t);
        const x = coordinates[0] + ex * Math.cos(theta) - ey * Math.sin(theta);
        const y = coordinates[1] + ex * Math.sin(theta) + ey * Math.cos(theta);
        points99.push({ x, y });
    }

    // 2
    const ellipsePoints = [];
    for (let j = 0; j <= nPoints; j++) {
        const t2 = (j / nPoints) * 2 * Math.PI;
        const ex2 = SemiMajor * Math.cos(t2);
        const ey2 = SemiMinor * Math.sin(t2);
        const x2 = coordinates[0] + ex2 * Math.cos(angle) - ey2 * Math.sin(angle);
        const y2 = coordinates[1] + ex2 * Math.sin(angle) + ey2 * Math.cos(angle);
        ellipsePoints.push({ x2, y2 });
    }

    const ellipseValues = computeEllipseValues(a, b, d, { confidence: 0.99});
    const EllipsePoints_s = generateEllipse(coordinates[0], coordinates[1], ellipseValues.semiMajor, ellipseValues.semiMinor, ellipseValues.angle, 100);
  </script>
  <script id = "40" type= "module" pinned="">
    Plot.plot({
        x: { domain: [0, 6] },
        y: { domain: [0, 6] },
        marks: [
            Plot.dot([{x: 2, y: 4}], {x: "x", y: "y", fill: "green"}),
            Plot.dot([{x: coordinates[0], y: coordinates[1]}], {x: "x", y: "y", fill: "red"}),
            Plot.line(points, {x: "x", y: "y", stroke: "black", strokeOpacity: 0.5}),
            Plot.line(points95, {x: "x", y: "y", stroke: "black", strokeOpacity: 0.5}),
            Plot.line(points90, {x: "x", y: "y", stroke: "black", strokeOpacity: 0.5}),
            Plot.line(points99, {x: "x", y: "y", stroke: "black", strokeOpacity: 0.5}),
            Plot.line(ellipsePoints, {x: "x2", y: "y2", stroke: "blue", strokeOpacity: 0.5}),
            Plot.line(EllipsePoints_s, {x: "x", y: "y", stroke: "green", strokeOpacity: 0.5}),
            

        ]
    })
  </script>
