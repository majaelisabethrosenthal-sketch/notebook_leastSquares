  <title>Non negative least Squares</title>
  <script id="1" type="text/markdown">
    # Non negative least Squares
  </script>
  <script id="2" type="text/markdown">
    Non-negative least-squares is a type of constrained least-squares problem where the coefficients are not allowed to become negative. 
    Given a matrix `A` and a vector of response variables `b`, the goal is to find a vector `x` that minimizes the Euclidean norm of the residual `R = b - A*x`, subject to ${tex`x \ge 0`}. 
    Here ${tex`x \ge 0`} means that each component of the vector `x` should be non-negative. 

    This can be further extended by adding a sum-to-one constraint (${tex`\sum x_i = 1`}), which restricts the coefficients to form a convex combination or mixture proportions that add up to 100%.

    To solve this constrained optimization problem in JavaScript, you can use the `quadprog npm` package, which is a direct port of the classic quadratic programming solver from R (originally derived from Fortran).
    
    The `quadprog npm` package expects the general quadratic programming formulation 

    ${tex`\begin{aligned}
    \text{minimize} \quad & -d^T x + \frac{1}{2} x^T D x \\
    \text{subject to} \quad & Amat^T x \geq bvec
    \end{aligned}`}
    
    which is mathematically equivalent to our least-squares problem ${tex` \text{minimize} \quad \|Ax - b\|^2`}, just expanded, divided by 2, and with the constant term ${tex`b^Tb`} dropped.
    
    Note: in the general quadratic programming formulation, ${tex`Amat`} and ${tex`bvec`} are NOT our matrix ${tex`A`} and vector ${tex`b`}. Instead they encode our constraints ${tex`x \ge 0`} and ${tex`\sum x_i = 1`}.
    
    Also note that ${tex`D=A^TA`} and ${tex`d=Aᵀb`}.

    Here we want to test the `quadprog npm` package. 

    Let us first define two reference points A and B and connect them with a line. Now we create one point that is exactly on that line and one that is slightly off. 
    NNLS should find ${tex`\alpha`} and ${tex`\beta`} for the two points so that the residual (the error distance) is minimized without allowing any negative mixing weights and with ${tex`\alpha + \beta = 1`}.
  </script>
  <script id="3" type="module" pinned="">
    const A = [
      [2, 4],
      [3, 6]
    ];

    const A3 = [
      [2, 4],
      [3, 6],
      [4, 5]
    ]

    const b = [0.7 * A[0][0] + 0.3 * A[1][0], 0.7 * A[0][1] + 0.3 * A[1][1]];
    const b_out = [0.5 * A3[0][0] + 0.2 * A3[1][0] + 0.3 * A3[2][0], 0.5 * A3[0][1] + 0.2 * A3[1][1] + 0.3 * A3[2][1]];
  </script>
  <script id="3" type="module" pinned="">
    Plot.plot({
        x: { domain: [0, 7] },
        y: { domain: [0, 7] },
        marks: [
            Plot.dot([{x: A[0][0], y: A[0][1]}], {x: "x", y: "y", fill: "green"}),
            Plot.dot([{x: A[1][0], y: A[1][1]}], {x: "x", y: "y", fill: "blue"}),
            Plot.text([{x: A[0][0], y: A[0][1], label: "A"}, {x: A[1][0], y: A[1][1], label: "B"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),
            Plot.link([{x1: A[0][0], y1: A[0][1], x2: A[1][0], y2: A[1][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.dot([{x: b[0], y: b[1]}], {x: "x", y: "y"}),
            Plot.dot([{x: b_out[0], y: b_out[1]}], {x: "x", y: "y"}),
            Plot.text([{x: b[0], y: b[1], label: "1"}, {x: b_out[0], y: b_out[1], label: "2"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),          
    ]
    })
  </script>
  <script id="4" type="module" pinned="">
    import { solveQP } from "quadprog";
    import { computeAtA, computeAtb, buildConstraints, copyMat } from "./pca_projection.browser.js";
    
    const AtA = computeAtA(A, 2);
    const Atb = computeAtb(A, b, 2);
    const constraints = buildConstraints(2);
    const result = solveQP(copyMat(AtA), Atb, constraints.Amat, constraints.bvec, constraints.meq);
    display(result.solution);

    const Atb_out = computeAtb(A, b_out, 2);
    const result_out = solveQP(copyMat(AtA), Atb_out, constraints.Amat, constraints.bvec, constraints.meq);
    display(result_out.solution);

  </script>
  <script id="5" type="text/markdown">
    ## Residuals (Goodness of fit)
    The residuals quantify how much the model's fit differs from the target's true coordinate values, serving as a direct indicator of the Goodness of Fit.
    Depending on the model complexity (number of coordinates used), we can evaluate residuals in two ways:

    Residuals per coordinate axis k:
    
    ${tex`Residuals_k = (x_{target,k} - x_{model,k})`}

    Residual Sum of Squares: 
    
    ${tex`RSS = \sum_{k=1}^{n}{(x_{target, k} - x_{model,k})^2 }`}

    A small residual means the point lies close to the line, while a large residual means it floats far away.

    Let us first plot the points modeled by NNLS in red.
  </script>
  <script id="6" type="module" pinned="">
    const bModel = [result.solution[1] * A[0][0] + result.solution[2] * A[1][0], result.solution[1] * A[0][1] + result.solution[2] * A[1][1]];
    const b_outModel = [result_out.solution[1] * A[0][0] + result_out.solution[2] * A[1][0],  result_out.solution[1] * A[0][1] + result_out.solution[2] * A[1][1]];
  </script>

  <script id="7" type="module" pinned="">
    Plot.plot({
        x: { domain: [0, 7] },
        y: { domain: [0, 7] },
        marks: [
            Plot.dot([{x: A[0][0], y: A[0][1]}], {x: "x", y: "y", fill: "green"}),
            Plot.dot([{x: A[1][0], y: A[1][1]}], {x: "x", y: "y", fill: "blue"}),
            Plot.text([{x: A[0][0], y: A[0][1], label: "A"}, {x: A[1][0], y: A[1][1], label: "B"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),
            Plot.link([{x1: A[0][0], y1: A[0][1], x2: A[1][0], y2: A[1][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.dot([{x: bModel[0], y: bModel[1]}], {x: "x", y: "y", fill: "red"}),
            Plot.dot([{x: b_outModel[0], y: b_outModel[1]}], {x: "x", y: "y", fill: "red"}), 
            Plot.dot([{x: b[0], y: b[1]}], {x: "x", y: "y"}),
            Plot.dot([{x: b_out[0], y: b_out[1]}], {x: "x", y: "y"}),
            Plot.text([{x: b[0], y: b[1], label: "1"}, {x: b_out[0], y: b_out[1], label: "2"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),   
            Plot.link([{x1: b_out[0], y1: b_out[1], x2: b_outModel[0], y2: b_out[1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "orange", strokeDasharray: "3,3"}),
            Plot.link([{x1: b_outModel[0], y1: b_out[1], x2: b_outModel[0], y2: b_outModel[1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "orange", strokeDasharray: "3,3"}),
            Plot.link([{x1: b_out[0], y1: b_out[1], x2: b_outModel[0], y2: b_outModel[1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "red",  strokeDasharray: "3,3"}),          
          ]
    })
  </script>
  <script id="8" type="module" pinned="">
    const residuals_b = [b[0] - bModel[0], b[1] - bModel[1]];
    const rss_b = residuals_b.reduce((sum, r) => sum + r*r, 0);

    const residuals_b_out = [b_out[0] - b_outModel[0], b_out[1] - b_outModel[1]];
    const rss_b_out = residuals_b_out.reduce((sum, r) => sum + r*r, 0);
  </script>

  <script id="9" type="text/markdown">
    For the point that lies exactly on the line, the residuals are (almost zero) (${residuals_b[0].toFixed(4)}, ${residuals_b[1].toFixed(4)}), giving an RSS of ${rss_b.toFixed(4)}.

    For the point that lies off the line, the residuals are (${residuals_b_out[0].toFixed(4)}, ${residuals_b_out[1].toFixed(4)}), giving a clearly larger RSS of ${rss_b_out.toFixed(4)}.

    This RSS value is exactly what NNLS minimizes. The smaller it is, the better the mixture of reference points explains the target.
  
    Let us now investigate how this will change if we add another reference point C.
  </script>

  <script id="10" type="module" pinned="">
    Plot.plot({
        x: { domain: [0, 7] },
        y: { domain: [0, 7] },
        marks: [
            Plot.dot([{x: A3[0][0], y: A3[0][1]}], {x: "x", y: "y", fill: "green"}),
            Plot.dot([{x: A3[1][0], y: A3[1][1]}], {x: "x", y: "y", fill: "blue"}),
            Plot.dot([{x: A3[2][0], y: A3[2][1]}], {x: "x", y: "y", fill: "purple"}),
            Plot.text([{x: A3[0][0], y: A3[0][1], label: "A"}, {x: A3[1][0], y: A3[1][1], label: "B"}, {x: A3[2][0], y: A3[2][1], label: "C"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),
            Plot.link([{x1: A3[0][0], y1: A3[0][1], x2: A3[1][0], y2: A3[1][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.link([{x1: A3[0][0], y1: A3[0][1], x2: A3[2][0], y2: A3[2][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.link([{x1: A3[1][0], y1: A3[1][1], x2: A3[2][0], y2: A3[2][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.dot([{x: b[0], y: b[1]}], {x: "x", y: "y"}),
            Plot.dot([{x: b_out[0], y: b_out[1]}], {x: "x", y: "y"}), 
            Plot.text([{x: b[0], y: b[1], label: "1"}, {x: b_out[0], y: b_out[1], label: "2"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),                    
    ]
    })
  </script>
  <script id="11" type="text/markdown">
    Now we can see that our second point is inside the triangle ABC. 

    Let us now test NNLS.
  </script>
  <script id="12" type="module" pinned="">
    const AtA3 = computeAtA(A3, 2);
    const Atb3 = computeAtb(A3, b, 2);
    const constraints3 = buildConstraints(3);
    const result3 = solveQP(copyMat(AtA3), Atb3, constraints3.Amat, constraints3.bvec, constraints3.meq);
    display(result3.solution);

    const Atb_out3 = computeAtb(A3, b_out, 2);
    const result_out3 = solveQP(copyMat(AtA3), Atb_out3, constraints3.Amat, constraints3.bvec, constraints3.meq);
    display(result_out3.solution);

  </script>
  <script id="13" type="text/markdown">
    Let us now plot the points modeled by NNLS in red.
  </script>
  <script id="14" type="module" pinned="">
    const bModel3 = [result3.solution[1] * A3[0][0] + result3.solution[2] * A3[1][0] + result3.solution[3] * A3[2][0] , result3.solution[1] * A3[0][1] + result3.solution[2] * A3[1][1] + result3.solution[3] * A3[2][1]];
    const b_outModel3 = [result_out3.solution[1] * A3[0][0] + result_out3.solution[2] * A3[1][0] + result_out3.solution[3] * A3[2][0],  result_out3.solution[1] * A3[0][1] + result_out3.solution[2] * A3[1][1] + result_out3.solution[3] * A3[2][1]];
  </script>
  <script id="15" type="module" pinned="">
    Plot.plot({
        x: { domain: [0, 7] },
        y: { domain: [0, 7] },
        marks: [
            Plot.dot([{x: A3[0][0], y: A3[0][1]}], {x: "x", y: "y", fill: "green"}),
            Plot.dot([{x: A3[1][0], y: A3[1][1]}], {x: "x", y: "y", fill: "blue"}),
            Plot.dot([{x: A3[2][0], y: A3[2][1]}], {x: "x", y: "y", fill: "purple"}),
            Plot.text([{x: A3[0][0], y: A3[0][1], label: "A"}, {x: A3[1][0], y: A3[1][1], label: "B"}, {x: A3[2][0], y: A3[2][1], label: "C"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),
            Plot.link([{x1: A3[0][0], y1: A3[0][1], x2: A3[1][0], y2: A3[1][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.link([{x1: A3[0][0], y1: A3[0][1], x2: A3[2][0], y2: A3[2][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.link([{x1: A3[1][0], y1: A3[1][1], x2: A3[2][0], y2: A3[2][1]}], {x1: "x1", y1: "y1", x2: "x2", y2: "y2", stroke: "black"}),
            Plot.dot([{x: bModel3[0], y: bModel3[1]}], {x: "x", y: "y", fill: "red"}),
            Plot.dot([{x: b_outModel3[0], y: b_outModel3[1]}], {x: "x", y: "y", fill: "red"}),
            Plot.dot([{x: b[0], y: b[1]}], {x: "x", y: "y"}),
            Plot.dot([{x: b_out[0], y: b_out[1]}], {x: "x", y: "y"}),   
            Plot.text([{x: b[0], y: b[1], label: "1"}, {x: b_out[0], y: b_out[1], label: "2"}], {x: "x", y: "y", text: "label", dy: -12, fontWeight: "bold", fontSize: 12}),                   
    ]
    })
  </script>
  <script id="16" type="module" pinned="">
    const residuals_b3 = [b[0] - bModel3[0], b[1] - bModel3[1]];
    const rss_b3 = residuals_b3.reduce((sum, r) => sum + r*r, 0);

    const residuals_b_out3 = [b_out[0] - b_outModel3[0], b_out[1] - b_outModel3[1]];
    const rss_b_out3 = residuals_b_out3.reduce((sum, r) => sum + r*r, 0);
  </script>
  <script id="17" type="text/markdown">
    Now the RSS of the first point again is (close to) zero (${rss_b3.toFixed(4)}), so nothing has changed.

    With reference point C added, the second target point has an RSS of ${rss_b_out3.toFixed(4)}, now also being (close to) zero, because the point now lies inside the triangle spanned by A, B and C, and can be expressed as a proper non-negative mixture of all three.
  </script>
