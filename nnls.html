  </script>

      pc3: o.pcCoordinates[2],
      pc4: o.pcCoordinates[3], 
      pc5: o.pcCoordinates[4],
      pc6: o.pcCoordinates[5],
      pc7: o.pcCoordinates[6], 
      pc8: o.pcCoordinates[7],

  <script id="70" type="text/markdown">
    ### Loading all eigenvalues
  </script>
  <script id="71" type="text/x-typescript" pinned="">
    const textData = await FileAttachment("data/Joscha_HiRes_WestEurasia.eval").text();
    const eigenvalues = textData.trim().split("\n").map(Number);
    display(eigenvalues);
  </script>
  <script id="72" type="text/markdown">
    The fraction of variance explained of a PC ${tex`i`} is given by ${tex`\frac{\lambda_i}{\sum \lambda_j}`} where ${tex`\lambda_i`} is the eigenvalue of the specific principal component and ${tex`\sum \lambda_j`} is the sum of all eigenvalues.
  </script>
  <script id="73" type="text/x-typescript" pinned="">
    const sumEigenvalues = eigenvalues.reduce((sum, val) => sum + val, 0);
    const fractionOfVarianceExplained = eigenvalues.map(val => val / sumEigenvalues);
  </script>

  </script>

  </script>
